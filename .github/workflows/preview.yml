name: Preview smoke tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npx puppeteer browsers install chrome --install-deps
      - run: npm run build
      - run: node tests/run.mjs --skip-build --set deployment
      - run: npm run scripts deploy:site -- --skip-build
      - run: node tests/run.mjs --skip-build --set smoke
        env:
          RZMPS_PREVIEW_OUTPUT: tests/output/previews/smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-diagnostics
          path: tests/output/preview-diagnostics
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canvas-previews
          path: tests/output/previews/smoke
          if-no-files-found: ignore
