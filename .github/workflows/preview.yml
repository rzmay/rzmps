name: Preview smoke tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx puppeteer browsers install chrome --install-deps
      - run: npm run build:modules
      - run: node --test tests/visual/docs-generation.test.mjs
      - run: npm run site:build
      - run: npm run site:browser-check
      - run: npm run preview:smoke
        env:
          RZMPS_PREVIEW_OUTPUT: previews/smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canvas-previews
          path: previews/smoke
          if-no-files-found: ignore
