name: Preview smoke tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npx puppeteer browsers install chrome --install-deps
      - run: node --test scripts/tests/preview/readback.test.mjs
      - run: npm run build:modules
      - run: npm run site:deploy
      - run: npm run site:browser-check
      - run: npm run preview:smoke
        env:
          RZMPS_PREVIEW_OUTPUT: previews/smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-diagnostics
          path: benchmark-results/preview-diagnostics
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canvas-previews
          path: previews/smoke
          if-no-files-found: ignore
