name: PR Benchmarks

on:
  pull_request:
    branches:
      - develop
      - release
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: benchmark-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  benchmark:
    if: github.event.pull_request.draft == false

    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RZMPS_BENCHMARK_DURATION_MS: 1500
      RZMPS_BENCHMARK_WARMUP_MS: 500
      RZMPS_BENCHMARK_PROFILE: ci
      RZMPS_BENCHMARK_WIDTH: 640
      RZMPS_BENCHMARK_HEIGHT: 360
      RZMPS_BENCHMARK_TIMEOUT_MS: 180000

    steps:
      - name: Checkout base
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            base/package-lock.json
            head/package-lock.json

      - name: Create results directory
        run: mkdir -p "$GITHUB_WORKSPACE/benchmark-results"

      - name: Install base dependencies
        working-directory: base
        env:
          PUPPETEER_SKIP_DOWNLOAD: true
        run: npm ci

      - name: Install PR dependencies
        working-directory: head
        run: npm ci

      - name: Build both libraries once
        run: |
          npm run build --workspace @rzmps/rzmps --prefix base
          npm run build --workspace @rzmps/rzmps --prefix head

      - name: Build both benchmarks with the same harness
        working-directory: head
        run: |
          node apps/demo/scripts/build-benchmark.mjs --library-root "$GITHUB_WORKSPACE/base" --out-dir "$GITHUB_WORKSPACE/benchmark-results/base-site"
          node apps/demo/scripts/build-benchmark.mjs --library-root "$GITHUB_WORKSPACE/head" --out-dir "$GITHUB_WORKSPACE/benchmark-results/head-site"

      - name: Measure interleaved samples (ABBAAB)
        working-directory: head
        run: |
          set -euo pipefail
          for sample in base-a head-a head-b base-b base-c head-c; do
            revision="${sample%-*}"
            node apps/demo/scripts/benchmark-rzmps.mjs --vsync \
              --dist "$GITHUB_WORKSPACE/benchmark-results/$revision-site" \
              --output "$GITHUB_WORKSPACE/benchmark-results/$sample.json"
          done

      - name: Aggregate benchmark samples
        working-directory: head
        run: |
          node scripts/aggregate-benchmarks.mjs \
            "$GITHUB_WORKSPACE/benchmark-results/base.json" \
            "$GITHUB_WORKSPACE/benchmark-results/base-a.json" \
            "$GITHUB_WORKSPACE/benchmark-results/base-b.json" \
            "$GITHUB_WORKSPACE/benchmark-results/base-c.json"

          node scripts/aggregate-benchmarks.mjs \
            "$GITHUB_WORKSPACE/benchmark-results/head.json" \
            "$GITHUB_WORKSPACE/benchmark-results/head-a.json" \
            "$GITHUB_WORKSPACE/benchmark-results/head-b.json" \
            "$GITHUB_WORKSPACE/benchmark-results/head-c.json"

      - name: Write PR metadata
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          jq -n \
            --argjson pr "$PR_NUMBER" \
            --arg baseSha "$BASE_SHA" \
            --arg headSha "$HEAD_SHA" \
            --arg baseRef "$BASE_REF" \
            --arg headRef "$HEAD_REF" \
            '{
              pr: $pr,
              baseSha: $baseSha,
              headSha: $headSha,
              baseRef: $baseRef,
              headRef: $headRef
            }' \
            > benchmark-results/metadata.json

      - name: Upload benchmark results and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmark-results/*.json
            benchmark-results/*.png
          if-no-files-found: warn
          retention-days: 30
