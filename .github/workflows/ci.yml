name: CI

on:
  pull_request:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run core tests
        run: npm test

      - name: Build packages
        run: npm run build:modules

      - name: Build demo
        run: npm run build --workspace demo

      - name: Check whitespace
        run: git diff --check
