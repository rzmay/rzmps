name: CI

on:
  pull_request:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-24.04
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint maintained source
        run: npm run lint

      - name: Report architecture warnings
        if: github.event_name != 'pull_request'
        run: npm run scripts check:dependencies

      - name: Compare PR architecture warnings
        if: github.event_name == 'pull_request'
        run: node scripts/dependencies/analyze.mjs

      - name: Upload dependency analysis
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dependency-report-${{ github.run_attempt }}
          path: .dependency-report/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

      - name: Build packages once
        run: npm run build

      - name: Run discovered unit and type tests
        run: npm test -- --skip-build

      - name: Validate documentation source
        run: npm run generate --workspace @rzmps/docs -- --check

      - name: Upload preview failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-diagnostics
          path: tests/output/preview-diagnostics
          if-no-files-found: ignore
          retention-days: 14

      - name: Build demo
        run: npm run build --workspace demo

      - name: Check generated documentation and build site
        run: npm run scripts check:docs:prepared

      - name: Validate skill installs and npm package contents
        run: npm run check:agents --workspace @rzmps/docs

      - name: Assemble combined static site
        run: node scripts/site/assemble.mjs

      - name: Check whitespace
        run: git diff --check
