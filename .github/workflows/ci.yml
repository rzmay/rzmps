name: CI

on:
  pull_request:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-24.04
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint maintained source
        run: npm run lint

      - name: Test preview diagnostics
        run: npm run test:preview-diagnostics

      - name: Check source import casing
        run: npm run test:source

      - name: Report architecture warnings
        if: github.event_name != 'pull_request'
        run: npm run check:dependencies

      - name: Compare PR architecture warnings
        if: github.event_name == 'pull_request'
        run: node scripts/dependencies/analyze.mjs

      - name: Upload dependency analysis
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dependency-report-${{ github.run_attempt }}
          path: .dependency-report/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

      - name: Test dependency reporting
        run: npm run test:dependencies

      - name: Validate preview and SEO unit tests
        run: npm run test:preview-media

      - name: Run core tests
        run: npm test

      - name: Validate benchmark reporting
        run: npm run test:benchmarks

      - name: Build packages
        run: npm run build:modules

      - name: Validate documentation source
        run: npm run docs:generate -- --check

      - name: Upload preview failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-diagnostics
          path: benchmark-results/preview-diagnostics
          if-no-files-found: ignore
          retention-days: 14

      - name: Build demo
        run: npm run build --workspace demo

      - name: Check generated documentation and build site
        run: npm run docs:check

      - name: Validate skill installs and npm package contents
        run: npm run agents:check

      - name: Validate combined deployment routing
        run: npm run site:check

      - name: Assemble combined static site
        run: node scripts/site/assemble.mjs

      - name: Check whitespace
        run: git diff --check
