name: Documentation
on:
  push:
    branches: [develop]
    paths:
      [
        "apps/docs/**",
        ".agents/**",
        "examples/**",
        "packages/rzmps/**",
        "scripts/docs/**",
        "scripts/preview/**",
        "apps/demo/**",
        "packages/ammo/**",
        "packages/jolt/**",
        "packages/rapier/**",
        "scripts/site/**",
        "typedoc.json",
        "package*.json",
        "render.yaml",
        ".github/workflows/docs.yml",
      ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate documentation source before generating assets
        run: npm run build:modules && npm run docs:generate -- --check
      - name: Install FFmpeg and pinned Puppeteer browser
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npx puppeteer browsers install chrome --install-deps
      - name: Verify headless WebGPU capture
        run: node --test scripts/tests/preview/backend.test.mjs scripts/tests/preview/player.test.mjs
      - name: Restore generated previews
        uses: actions/cache@v4
        with:
          path: apps/docs/public/previews
          key: previews-v2-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            previews-v2-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            previews-v2-${{ runner.os }}-
      - name: Generate, validate, and assemble deployment
        run: npm run site:deploy
      - run: npm run site:check
      - uses: actions/upload-artifact@v4
        with:
          name: combined-static-site
          path: dist
