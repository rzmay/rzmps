name: Documentation
on:
  push:
    branches: [develop]
    paths: ['apps/docs/**', '.agents/**', 'examples/**', 'packages/rzmps/**', 'scripts/docs/**', 'scripts/site/**', 'typedoc.json', 'package*.json', 'render.yaml', '.github/workflows/docs.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run site:build
      - run: npm run site:check
      - uses: actions/upload-artifact@v4
        with:
          name: combined-static-site
          path: dist
