name: PR Benchmark Comment

on:
  workflow_run:
    workflows: [PR Benchmarks]
    types: [in_progress, completed]

permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write

concurrency:
  group: benchmark-comment-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Observe checkpoints and update one PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const path = require('node:path');
            const { reportBenchmarkProgress } = await import(pathToFileURL(path.resolve('scripts/benchmark/report-benchmark-progress.mjs')).href);
            await reportBenchmarkProgress({ github, context, core });
