name: PR Benchmark Comment

on:
  workflow_run:
    workflows:
      - PR Benchmarks
    types:
      - completed

permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write

jobs:
  comment:
    if: github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download benchmark artifact
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compare benchmarks
        run: |
          node scripts/compare-benchmarks.mjs \
            benchmark-results/base.json \
            benchmark-results/head.json \
            benchmark-results/comparison.md \
            benchmark-results/comparison.json

      - name: Add commit information
        run: |
          node <<'NODE'
          const fs = require('fs');

          const metadata = JSON.parse(
            fs.readFileSync(
              'benchmark-results/metadata.json',
              'utf8',
            ),
          );

          const path =
            'benchmark-results/comparison.md';

          const original =
            fs.readFileSync(path, 'utf8');

          const info = [
            `**Base:** \`${metadata.baseRef}@${metadata.baseSha.slice(0, 7)}\``,
            `**PR:** \`${metadata.headRef}@${metadata.headSha.slice(0, 7)}\``,
            '',
          ].join('\n');

          fs.writeFileSync(
            path,
            original.replace(
              '## 📊 Benchmark comparison\n',
              `## 📊 Benchmark comparison\n\n${info}`,
            ),
          );
          NODE

      - name: Post or update PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const metadata = JSON.parse(
              fs.readFileSync(
                'benchmark-results/metadata.json',
                'utf8',
              ),
            );

            const body = fs.readFileSync(
              'benchmark-results/comparison.md',
              'utf8',
            );

            const marker =
              '<!-- rzmps-benchmark-report -->';

            const owner =
              context.repo.owner;

            const repo =
              context.repo.repo;

            const issue_number =
              metadata.pr;

            const comments =
              await github.paginate(
                github.rest.issues.listComments,
                {
                  owner,
                  repo,
                  issue_number,
                  per_page: 100,
                },
              );

            const existing =
              comments.find(
                (comment) =>
                  comment.user?.type === 'Bot'
                  && comment.body?.includes(marker),
              );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
