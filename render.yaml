# One static deployment: demo at / and VitePress documentation at /docs/.
services:
  - type: web
    runtime: static
    name: rzmps
    branch: develop
    # Omit rootDir: Render must use the repository root for npm workspace linking.
    buildCommand: npm ci && npx puppeteer browsers install chrome && npm run site:build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: PUPPETEER_SKIP_DOWNLOAD
        value: "true"
      - key: CI
        value: "true"
    routes:
      - type: rewrite
        source: /docs
        destination: /docs/index.html
      - type: rewrite
        source: /docs/
        destination: /docs/index.html
